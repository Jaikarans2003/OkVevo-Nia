# Tagged desktop release: sign + notarize/Authenticode + publish the generic feed.
#
# Fail-closed: require-secrets exits 1 if Apple, Windows, or feed-upload secrets
# are missing. Nothing unsigned is published. Do not cut a v* tag until those
# secrets exist — see docs/FINISH-SIGNED-RELEASE.md.

name: Desktop signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  require-secrets:
    name: Fail closed if signing secrets are missing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Require release secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          RELEASES_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
        run: node apps/desktop/scripts/require-release-secrets.mjs

  macos:
    name: macOS arm64 signed zip+dmg
    needs: require-secrets
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      NIA_REQUIRE_NOTARIZE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - run: npm ci
      - name: Build and pack (publish never — we upload after verify)
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --mac dmg zip --publish never
      - name: Verify Developer ID signature
        run: |
          app=$(ls -d apps/desktop/release/mac*/Nia.app | head -1)
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nia-mac
          path: |
            apps/desktop/release/Nia-*.dmg
            apps/desktop/release/Nia-*.zip
            apps/desktop/release/latest-mac.yml

  windows:
    name: Windows x64 signed NSIS
    needs: require-secrets
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      NIA_REQUIRE_WIN_SIGN: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm --version | grep -q '^12\.' || npm i -g npm@12
        shell: bash
      - run: npm ci
      - name: Build and pack (publish never — we upload after verify)
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --win nsis --publish never
      - name: Verify Authenticode
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/desktop/release -Filter 'Nia-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Authenticode $($sig.Status) for $($exe.Name)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nia-win
          path: |
            apps/desktop/release/Nia-*.exe
            apps/desktop/release/latest.yml

  publish-feed:
    name: Upload signed feed to releases.okvevo.com
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: feed
          merge-multiple: true
      - name: Publish to S3/R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
        run: |
          extra=()
          if [ -n "$RELEASES_S3_ENDPOINT" ]; then
            extra+=(--endpoint-url "$RELEASES_S3_ENDPOINT")
          fi
          aws s3 sync feed "s3://${RELEASES_S3_BUCKET}/" "${extra[@]}" \
            --exclude '*' \
            --include 'Nia-*' \
            --include 'latest*.yml'
