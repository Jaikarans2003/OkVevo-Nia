# v* tags no longer ship a build. Customer latest.yml is desktop-promote.yml
# (workflow_dispatch on production). Staging/production branches pack via
# desktop-staging.yml / desktop-production.yml.

name: Deprecated tag release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  refuse:
    name: v* tags are labels, not the ship trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the new path
        run: |
          echo "::error::Do not ship from a v* tag. Merge to production (packs internal.yml), then Actions → Desktop promote to latest."
          echo "See docs/FINISH-SIGNED-RELEASE.md and docs/CI-CD.md."
          exit 1
