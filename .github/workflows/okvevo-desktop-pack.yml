# Reusable public-channel pack + sign + feed upload.
# Callers: desktop-staging.yml, desktop-production.yml.
# Never uses GitHub Environments (Free-plan private-safe). Never pack:internal.
# Reusable workflows cannot `if: secrets` — signing presence is a job output.

name: OkVevo desktop pack (reusable)

on:
  workflow_call:
    inputs:
      pack_target:
        description: staging or production
        required: true
        type: string
      feed_prefix:
        description: S3 key prefix. Staging is okvevo/staging. Production is okvevo/stable (bucket-root copies stay). Empty skips the prefix upload.
        required: false
        default: ''
        type: string
      yml_mode:
        description: staging (artifacts + R2 sync), versioned (direct R2 archive), artifacts (GitHub artifacts only), or build (pack and assert only, no upload, no publish)
        required: true
        type: string
      version:
        description: vX.Y.Z or X.Y.Z from git tag. Empty stamps major.minor.run_number
        required: false
        default: ''
        type: string
      allow_unsigned:
        description: If true, missing Apple/Windows certs do not fail the run (feed secrets still required)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  require-secrets:
    name: Fail closed if required pack secrets are missing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac_signing: ${{ steps.signing.outputs.mac_signing }}
      win_signing: ${{ steps.signing.outputs.win_signing }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Brand asset spec
        run: python3 scripts/okvevo/asset_spec.py --check
      - name: Check yml_mode
        run: |
          set -euo pipefail
          mode="${{ inputs.yml_mode }}"
          if [ "$mode" != 'staging' ] && [ "$mode" != 'versioned' ] && [ "$mode" != 'artifacts' ] && [ "$mode" != 'build' ]; then
            echo "::error::yml_mode must be staging, versioned, artifacts, or build, got $mode"
            exit 1
          fi
      - name: Map prefixed repository secrets
        shell: bash
        env:
          PACK_TARGET: ${{ inputs.pack_target }}
          STAGING_OKVEVO_WEB_ORIGIN: ${{ secrets.STAGING_OKVEVO_WEB_ORIGIN }}
          PROD_OKVEVO_WEB_ORIGIN: ${{ secrets.PROD_OKVEVO_WEB_ORIGIN }}
        run: node apps/desktop/scripts/ci-map-pack-env.mjs
      - name: Unsigned pack warning
        if: ${{ inputs.allow_unsigned }}
        run: echo "::warning::UNSIGNED PACK ALLOWED"
      - name: Require feed and signing secrets
        if: ${{ inputs.yml_mode != 'artifacts' && inputs.yml_mode != 'build' }}
        env:
          OKVEVO_ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          RELEASES_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
        run: node apps/desktop/scripts/require-release-secrets.mjs
      - name: Artifacts-only note
        if: ${{ inputs.yml_mode == 'artifacts' }}
        run: |
          echo "yml_mode=artifacts: skip RELEASES_S3 / feed gate; no R2 publish-feed job."
          echo "Pack still uses STAGING_* portal env for an installable smoke binary."
      - name: Require pack-env secrets
        run: node apps/desktop/scripts/write-okvevo-pack-env.mjs --require
      - name: Detect signing material
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mac=false
          win=false
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            mac=true
          fi
          if [ -n "${WIN_CSC_LINK:-}" ] && [ -n "${WIN_CSC_KEY_PASSWORD:-}" ]; then
            win=true
          fi
          echo "mac_signing=$mac" >> "$GITHUB_OUTPUT"
          echo "win_signing=$win" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS arm64 zip+dmg
    needs: require-secrets
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.require-secrets.outputs.mac_signing == 'true' && 'true' || 'false' }}
      OKVEVO_REQUIRE_NOTARIZE: ${{ needs.require-secrets.outputs.mac_signing == 'true' && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      # apps/desktop has no lockfile of its own; the workspace lock is the root one.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - run: npm ci
      - name: Map prefixed repository secrets
        shell: bash
        env:
          PACK_TARGET: ${{ inputs.pack_target }}
          STAGING_OKVEVO_WEB_ORIGIN: ${{ secrets.STAGING_OKVEVO_WEB_ORIGIN }}
          PROD_OKVEVO_WEB_ORIGIN: ${{ secrets.PROD_OKVEVO_WEB_ORIGIN }}
        run: node apps/desktop/scripts/ci-map-pack-env.mjs
      - name: Require pack-env
        working-directory: apps/desktop
        run: node scripts/write-okvevo-pack-env.mjs --require
      # desktop.py refuses a dirty checkout. Upstream's Desktop pack restores
      # ffmpeg into apps/desktop/resources/ffmpeg and then builds. Those files
      # are untracked, so this pack prepares the payload before that restore.
      # Payload cache is keyed on uv.lock + pm/lock.json. A hit skips prepare.
      # The LGPL ffmpeg cache below is separate and already present.
      - name: Restore bundled agent payload
        id: agent-payload
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/agent-payload
            apps/desktop/build/agent-payload.prepared.json
          key: bundled-agent-payload-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pm/lock.json') }}
      - name: Prepare bundled agent payload
        if: steps.agent-payload.outputs.cache-hit != 'true'
        run: bash apps/desktop/scripts/ci-prepare-bundled-payload.sh
      - name: Save bundled agent payload
        if: steps.agent-payload.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/agent-payload
            apps/desktop/build/agent-payload.prepared.json
          key: bundled-agent-payload-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pm/lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/resources/ffmpeg
          key: lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.mjs', 'apps/desktop/scripts/fetch-ffmpeg.mjs') }}
      - name: Cache electron-builder
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Stamp version and pack (public channel, publish never)
        working-directory: apps/desktop
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          OKVEVO_PACK_VERSION: ${{ inputs.version }}
          HERMES_DESKTOP_VARIANT: bundled
        run: |
          set -euo pipefail
          unset HERMES_BUILD_COMMIT || true
          PKG_VER=$(node -p "require('./package.json').version")
          if [ -n "${OKVEVO_PACK_VERSION:-}" ]; then
            VERSION=$(node scripts/ci-desktop-version.mjs --from-tag "$OKVEVO_PACK_VERSION")
          else
            VERSION=$(node scripts/ci-desktop-version.mjs "$PKG_VER" "$GITHUB_RUN_NUMBER")
          fi
          echo "OKVEVO_CI_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Pack version $VERSION"
          # Stamp install-stamp + About via write-build-stamp (hides 0.0.0 placeholders).
          export HERMES_PAYLOAD_VERSION="$VERSION"
          # Empty CSC_LINK makes electron-builder treat cwd as a cert file.
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD || true; fi
          # Actions always sets GITHUB_TOKEN; with publish:github that can POST
          # /releases on tag packs. ci-map-pack-env sets CLOUDFLARE_R2_PUBLIC_URL
          # (generic); strip tokens so a misconfig cannot hit GitHub Releases.
          unset GH_TOKEN GITHUB_TOKEN || true
          node scripts/fetch-ffmpeg.mjs
          npm run build
          npm run builder -- --mac dmg zip --publish never \
            -c.extraMetadata.version="$VERSION"
          node scripts/publish-release-feed.mjs write-yml --dir release --platform mac --version "$VERSION"
      - name: Measure unpacked Mac Resources
        run: |
          set +e
          app=$(ls -d apps/desktop/release/mac*/OkVevo.app 2>/dev/null | head -1)
          {
            echo "## Unpacked Mac Resources (KiB, top 30)"
            if [ -z "${app:-}" ]; then
              echo "No OkVevo.app Resources tree to measure."
            else
              du -sk "$app/Contents/Resources"/* "$app/Contents/Resources/agent-payload"/* 2>/dev/null | sort -nr | head -30
              echo "### tools"
              du -sk "$app/Contents/Resources/agent-payload/tools"/* 2>/dev/null | sort -nr | head -30
              echo "### venv / uv-cache"
              du -sk "$app/Contents/Resources/agent-payload/venv"/* "$app/Contents/Resources/agent-payload/uv-cache"/* 2>/dev/null | sort -nr | head -30
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: B5 coding smoke (packed Mac runtime)
        run: bash scripts/okvevo/b5-coding-smoke.sh "$(ls -d apps/desktop/release/mac*/OkVevo.app | head -1)/Contents/Resources/agent-payload"
      - name: Assert bundled payload and baked feed
        run: |
          set -euo pipefail
          app=$(ls -d apps/desktop/release/mac*/OkVevo.app | head -1)
          node apps/desktop/scripts/ci-assert-bundled-pack.mjs \
            --resources "$app/Contents/Resources" \
            --target "${{ inputs.pack_target }}" \
            --prefix "${{ inputs.feed_prefix }}"
      - name: Assert packaged OkVevo icons (no Hermes asar marks)
        run: |
          set -euo pipefail
          app=$(ls -d apps/desktop/release/mac*/OkVevo.app | head -1)
          node apps/desktop/scripts/ci-assert-packaged-icons.mjs \
            --app "$app" \
            --platform darwin
      - name: Assert DMG layout matches brand/
        run: node apps/desktop/scripts/ci-assert-dmg-layout.mjs
      - name: No E2E sign-in hook in public pack
        run: |
          set -euo pipefail
          app=$(ls -d apps/desktop/release/mac*/OkVevo.app | head -1)
          node apps/desktop/scripts/check-no-e2e-auth.mjs --resources "$app/Contents/Resources"
      - name: Packed-app chat E2E
        if: ${{ inputs.yml_mode == 'build' }}
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app=$(ls -d release/mac*/OkVevo.app | head -1)
          export OKVEVO_E2E_EXECUTABLE="$PWD/$app/Contents/MacOS/OkVevo"
          test -f "$OKVEVO_E2E_EXECUTABLE"
          python3 ../../scripts/okvevo/check_vendor_keys.py --pack "$PWD/$app/Contents/Resources"
          npx playwright test --config e2e/okvevo/playwright.config.ts
      - name: Upload packed-app E2E screenshots
        if: ${{ always() && inputs.yml_mode == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: okvevo-packed-e2e-mac
          path: |
            apps/desktop/release/e2e-screenshots
            apps/desktop/release/e2e-diagnostics
            apps/desktop/release/e2e-playwright
          if-no-files-found: ignore
      - name: List bundled OSS notice
        run: |
          set -euo pipefail
          unpacked=$(find apps/desktop/release -path '*/OkVevo.app/Contents/Resources/THIRD_PARTY_NOTICES.txt' | head -1)
          test -n "$unpacked"
          echo "BUNDLED_OSS_NOTICE $unpacked"
          zipfile=$(ls apps/desktop/release/OkVevo-*-mac-*.zip | head -1)
          unzip -l "$zipfile" | grep -F 'Contents/Resources/THIRD_PARTY_NOTICES.txt'
      - name: Verify Developer ID signature
        if: ${{ needs.require-secrets.outputs.mac_signing == 'true' }}
        run: |
          app=$(ls -d apps/desktop/release/mac*/OkVevo.app | head -1)
          codesign --verify --deep --strict "$app"
      - name: Archive versioned mac objects to R2
        if: ${{ inputs.yml_mode == 'versioned' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/publish-release-feed.mjs archive \
            --dir apps/desktop/release \
            --platform mac \
            --version "$OKVEVO_CI_VERSION" \
            --prefix "${{ inputs.feed_prefix }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.yml_mode == 'staging' || inputs.yml_mode == 'artifacts' }}
        with:
          name: okvevo-mac
          path: |
            apps/desktop/release/OkVevo-*.dmg
            apps/desktop/release/OkVevo-*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/mac*/OkVevo.app/Contents/Resources/THIRD_PARTY_NOTICES.txt

  windows:
    name: Windows x64 NSIS
    needs: require-secrets
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      OKVEVO_REQUIRE_WIN_SIGN: ${{ needs.require-secrets.outputs.win_signing == 'true' && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm --version | grep -q '^12\.' || npm i -g npm@12
        shell: bash
      - run: npm ci
      - name: Map prefixed repository secrets
        shell: bash
        env:
          PACK_TARGET: ${{ inputs.pack_target }}
          STAGING_OKVEVO_WEB_ORIGIN: ${{ secrets.STAGING_OKVEVO_WEB_ORIGIN }}
          PROD_OKVEVO_WEB_ORIGIN: ${{ secrets.PROD_OKVEVO_WEB_ORIGIN }}
        run: node apps/desktop/scripts/ci-map-pack-env.mjs
      - name: Require pack-env
        working-directory: apps/desktop
        shell: bash
        run: node scripts/write-okvevo-pack-env.mjs --require
      # Same order as macOS: prepare while the checkout is still clean.
      # Skip prepare when the lockfile-keyed payload cache already exists.
      - name: Restore bundled agent payload
        id: agent-payload
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/agent-payload
            apps/desktop/build/agent-payload.prepared.json
          key: bundled-agent-payload-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pm/lock.json') }}
      - name: Prepare bundled agent payload
        if: steps.agent-payload.outputs.cache-hit != 'true'
        shell: bash
        run: bash apps/desktop/scripts/ci-prepare-bundled-payload.sh
      - name: Save bundled agent payload
        if: steps.agent-payload.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/agent-payload
            apps/desktop/build/agent-payload.prepared.json
          key: bundled-agent-payload-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pm/lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/resources/ffmpeg
          # cold1: force cache miss so ensure+fetch prove the R2 mirror path.
          key: lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.mjs', 'apps/desktop/scripts/fetch-ffmpeg.mjs') }}-cold1
          restore-keys: |
            lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-
      - name: Seed/verify Windows FFmpeg R2 mirror (cold fetch)
        working-directory: apps/desktop
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
        run: node scripts/ensure-ffmpeg-win-mirror.mjs --cold
      - name: Cache electron-builder
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Stamp version and pack (public channel, publish never)
        working-directory: apps/desktop
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          OKVEVO_PACK_VERSION: ${{ inputs.version }}
          HERMES_DESKTOP_VARIANT: bundled
        run: |
          set -euo pipefail
          unset HERMES_BUILD_COMMIT || true
          PKG_VER=$(node -p "require('./package.json').version")
          if [ -n "${OKVEVO_PACK_VERSION:-}" ]; then
            VERSION=$(node scripts/ci-desktop-version.mjs --from-tag "$OKVEVO_PACK_VERSION")
          else
            VERSION=$(node scripts/ci-desktop-version.mjs "$PKG_VER" "$GITHUB_RUN_NUMBER")
          fi
          echo "OKVEVO_CI_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Pack version $VERSION"
          # Stamp install-stamp + About via write-build-stamp (hides 0.0.0 placeholders).
          export HERMES_PAYLOAD_VERSION="$VERSION"
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD || true; fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true; fi
          # See mac pack step: no GitHub Releases from electron-builder.
          unset GH_TOKEN GITHUB_TOKEN || true
          node scripts/fetch-ffmpeg.mjs
          npm run build
          npm run builder -- --win nsis --publish never \
            -c.extraMetadata.version="$VERSION"
          node scripts/publish-release-feed.mjs write-yml --dir release --platform win --version "$VERSION"
      - name: Measure unpacked Windows tree
        shell: bash
        run: |
          set +e
          win=apps/desktop/release/win-unpacked
          {
            echo "## Unpacked Windows tree (KiB, top 30)"
            if [ ! -d "$win/resources" ]; then
              echo "No win-unpacked resources tree to measure."
            else
              du -sk "$win/resources"/* "$win/resources/agent-payload"/* 2>/dev/null | sort -nr | head -30
              echo "### tools"
              du -sk "$win/resources/agent-payload/tools"/* 2>/dev/null | sort -nr | head -30
              echo "### venv / uv-cache"
              du -sk "$win/resources/agent-payload/venv"/* "$win/resources/agent-payload/uv-cache"/* 2>/dev/null | sort -nr | head -30
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: B5 coding smoke (packed Windows runtime)
        shell: bash
        run: bash scripts/okvevo/b5-coding-smoke.sh apps/desktop/release/win-unpacked/resources/agent-payload
      - name: Assert bundled payload and baked feed
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/ci-assert-bundled-pack.mjs \
            --resources apps/desktop/release/win-unpacked/resources \
            --target "${{ inputs.pack_target }}" \
            --prefix "${{ inputs.feed_prefix }}"
      - name: Assert packaged OkVevo icons (no Hermes asar marks)
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/ci-assert-packaged-icons.mjs \
            --app apps/desktop/release/win-unpacked \
            --platform win32
      - name: Assert DMG layout matches brand/
        shell: bash
        run: node apps/desktop/scripts/ci-assert-dmg-layout.mjs
      - name: No E2E sign-in hook in public pack
        shell: bash
        run: |
          set -euo pipefail
          node apps/desktop/scripts/check-no-e2e-auth.mjs --resources apps/desktop/release/win-unpacked/resources
      - name: Packed-app chat E2E
        if: ${{ inputs.yml_mode == 'build' }}
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          export OKVEVO_E2E_EXECUTABLE="$PWD/release/win-unpacked/OkVevo.exe"
          test -f "$OKVEVO_E2E_EXECUTABLE"
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          "$py" ../../scripts/okvevo/check_vendor_keys.py --pack "$PWD/release/win-unpacked/resources"
          npx playwright test --config e2e/okvevo/playwright.config.ts
      - name: Upload packed-app E2E screenshots
        if: ${{ always() && inputs.yml_mode == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: okvevo-packed-e2e-win
          path: |
            apps/desktop/release/e2e-screenshots
            apps/desktop/release/e2e-diagnostics
            apps/desktop/release/e2e-playwright
          if-no-files-found: ignore
      - name: List bundled OSS notice
        shell: bash
        run: |
          set -euo pipefail
          notice=apps/desktop/release/win-unpacked/resources/THIRD_PARTY_NOTICES.txt
          test -f "$notice"
          echo "BUNDLED_OSS_NOTICE $notice"
          ls -l "$notice"
          ls -l apps/desktop/release/OkVevo-*-win-*.exe
      - name: Verify Authenticode
        if: ${{ needs.require-secrets.outputs.win_signing == 'true' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/desktop/release -Filter 'OkVevo-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "Authenticode $($sig.Status) for $($exe.Name)" }
      - name: Archive versioned win objects to R2
        if: ${{ inputs.yml_mode == 'versioned' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/publish-release-feed.mjs archive \
            --dir apps/desktop/release \
            --platform win \
            --version "$OKVEVO_CI_VERSION" \
            --prefix "${{ inputs.feed_prefix }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ inputs.yml_mode == 'staging' || inputs.yml_mode == 'artifacts' }}
        with:
          name: okvevo-win
          path: |
            apps/desktop/release/OkVevo-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/win-unpacked/resources/THIRD_PARTY_NOTICES.txt

  # PR 1.3: sign-in E2E pack variant. Same commit, same steps as the public
  # pack, but the electron bundle is built with OKVEVO_E2E_AUTH=1 so the
  # e2eCompleteOkvevoSignIn preload bridge exists. Never uploads anything;
  # build mode only, so it can never ship. The public jobs above carry the
  # check-no-e2e-auth step proving the customer pack has no trace of the hook.
  macos-e2e:
    name: macOS sign-in E2E pack
    needs: require-secrets
    if: ${{ inputs.yml_mode == 'build' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - run: npm ci
      - name: Map prefixed repository secrets
        shell: bash
        env:
          PACK_TARGET: ${{ inputs.pack_target }}
          STAGING_OKVEVO_WEB_ORIGIN: ${{ secrets.STAGING_OKVEVO_WEB_ORIGIN }}
          PROD_OKVEVO_WEB_ORIGIN: ${{ secrets.PROD_OKVEVO_WEB_ORIGIN }}
        run: node apps/desktop/scripts/ci-map-pack-env.mjs
      - name: Require pack-env
        working-directory: apps/desktop
        run: node scripts/write-okvevo-pack-env.mjs --require
      - name: Restore bundled agent payload
        id: agent-payload
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/agent-payload
            apps/desktop/build/agent-payload.prepared.json
          key: bundled-agent-payload-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pm/lock.json') }}
      - name: Prepare bundled agent payload
        if: steps.agent-payload.outputs.cache-hit != 'true'
        run: bash apps/desktop/scripts/ci-prepare-bundled-payload.sh
      - name: Restore electron-builder cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/resources/ffmpeg
          key: lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.mjs', 'apps/desktop/scripts/fetch-ffmpeg.mjs') }}
      - name: Stamp version and pack (E2E sign-in variant, unpacked only)
        working-directory: apps/desktop
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HERMES_DESKTOP_VARIANT: bundled
          OKVEVO_E2E_AUTH: '1'
        run: |
          set -euo pipefail
          unset HERMES_BUILD_COMMIT || true
          PKG_VER=$(node -p "require('./package.json').version")
          VERSION=$(node scripts/ci-desktop-version.mjs "$PKG_VER" "$GITHUB_RUN_NUMBER")
          echo "E2E pack version $VERSION"
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD || true; fi
          unset GH_TOKEN GITHUB_TOKEN || true
          node scripts/fetch-ffmpeg.mjs
          npm run build
          npm run builder -- --dir --publish never \
            -c.extraMetadata.version="$VERSION"
      - name: Stamp bundle before launch
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app=$(ls -d release/mac*/OkVevo.app | head -1)
          touch release/.bundle-stamp
          echo "Stamped $app"
      - name: Packed sign-in chat E2E
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app=$(ls -d release/mac*/OkVevo.app | head -1)
          export OKVEVO_E2E_EXECUTABLE="$PWD/$app/Contents/MacOS/OkVevo"
          test -f "$OKVEVO_E2E_EXECUTABLE"
          npx playwright test --config e2e/okvevo/playwright.config.ts packed-signin-chat
          npx playwright test --config e2e/okvevo/playwright.config.ts packed-mention-menu
          npx playwright test --config e2e/okvevo/playwright.config.ts packed-quit-relaunch
      - name: Prove Mac bundle unchanged after launch
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app=$(ls -d release/mac*/OkVevo.app | head -1)
          bash "$GITHUB_WORKSPACE/scripts/okvevo/prove-bundle-unchanged.sh" "$PWD/$app" "$PWD/release/.bundle-stamp"
      - name: Upload sign-in E2E screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: okvevo-signin-e2e-mac
          path: |
            apps/desktop/release/e2e-screenshots
            apps/desktop/release/e2e-diagnostics
            apps/desktop/release/e2e-playwright
          if-no-files-found: ignore

  windows-e2e:
    name: Windows sign-in E2E pack
    needs: require-secrets
    if: ${{ inputs.yml_mode == 'build' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm --version | grep -q '^12\.' || npm i -g npm@12
        shell: bash
      - run: npm ci
      - name: Map prefixed repository secrets
        shell: bash
        env:
          PACK_TARGET: ${{ inputs.pack_target }}
          STAGING_OKVEVO_WEB_ORIGIN: ${{ secrets.STAGING_OKVEVO_WEB_ORIGIN }}
          PROD_OKVEVO_WEB_ORIGIN: ${{ secrets.PROD_OKVEVO_WEB_ORIGIN }}
        run: node apps/desktop/scripts/ci-map-pack-env.mjs
      - name: Require pack-env
        working-directory: apps/desktop
        shell: bash
        run: node scripts/write-okvevo-pack-env.mjs --require
      - name: Restore bundled agent payload
        id: agent-payload
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/build/agent-payload
            apps/desktop/build/agent-payload.prepared.json
          key: bundled-agent-payload-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'pm/lock.json') }}
      - name: Prepare bundled agent payload
        if: steps.agent-payload.outputs.cache-hit != 'true'
        shell: bash
        run: bash apps/desktop/scripts/ci-prepare-bundled-payload.sh
      - name: Restore electron-builder cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/desktop/resources/ffmpeg
          key: lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.mjs', 'apps/desktop/scripts/fetch-ffmpeg.mjs') }}-cold1
          restore-keys: |
            lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-
      - name: Seed/verify Windows FFmpeg R2 mirror (cold fetch)
        working-directory: apps/desktop
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
        run: node scripts/ensure-ffmpeg-win-mirror.mjs --cold
      - name: Stamp version and pack (E2E sign-in variant, unpacked only)
        working-directory: apps/desktop
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          HERMES_DESKTOP_VARIANT: bundled
          OKVEVO_E2E_AUTH: '1'
        run: |
          set -euo pipefail
          unset HERMES_BUILD_COMMIT || true
          PKG_VER=$(node -p "require('./package.json').version")
          VERSION=$(node scripts/ci-desktop-version.mjs "$PKG_VER" "$GITHUB_RUN_NUMBER")
          echo "E2E pack version $VERSION"
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD || true; fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true; fi
          unset GH_TOKEN GITHUB_TOKEN || true
          node scripts/fetch-ffmpeg.mjs
          npm run build
          npm run builder -- --dir --publish never \
            -c.extraMetadata.version="$VERSION"
      - name: Packed sign-in chat E2E
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          export OKVEVO_E2E_EXECUTABLE="$PWD/release/win-unpacked/OkVevo.exe"
          test -f "$OKVEVO_E2E_EXECUTABLE"
          npx playwright test --config e2e/okvevo/playwright.config.ts packed-signin-chat
          npx playwright test --config e2e/okvevo/playwright.config.ts packed-mention-menu
      - name: Upload sign-in E2E screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: okvevo-signin-e2e-win
          path: |
            apps/desktop/release/e2e-screenshots
            apps/desktop/release/e2e-diagnostics
            apps/desktop/release/e2e-playwright
          if-no-files-found: ignore

  publish-feed:
    name: Upload signed feed
    if: ${{ inputs.yml_mode == 'staging' }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: feed
          merge-multiple: true
      # Installers, then an HTTPS check of their sha512/size against latest*.yml,
      # then latest*.yml last. A mismatch fails here with the old feed untouched.
      - name: Publish to S3/R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          extra=()
          prefix="${{ inputs.feed_prefix }}"
          if [ -n "$prefix" ]; then
            extra+=(--prefix "$prefix")
          fi
          node apps/desktop/scripts/publish-release-feed.mjs sync --dir feed --mode staging "${extra[@]}"

  archive-complete:
    name: Archive complete
    if: ${{ inputs.yml_mode == 'versioned' }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "archive complete"

  ci-gate:
    name: ci-gate / reusable pack
    needs: [require-secrets, macos, windows, macos-e2e, windows-e2e, publish-feed, archive-complete]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | python3 scripts/ci/required_results.py
