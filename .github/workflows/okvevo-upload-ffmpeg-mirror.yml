# One-shot: restore Windows ffmpeg Actions cache (or fail) and publish the
# pinned BtbN win64-lgpl zip to R2 deps/ffmpeg/ for cold pack fetches.
# Uses repository RELEASES_S3_* secrets. Safe to re-run (overwrite).

name: Upload FFmpeg R2 mirror

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okvevo-upload-ffmpeg-mirror
  cancel-in-progress: false

jobs:
  upload:
    name: Upload win64-lgpl zip to R2
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Refuse Nous
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" = "NousResearch/hermes-agent" ]; then
            echo "::error::Refusing to upload from NousResearch/hermes-agent"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ffmpeg-cache
        with:
          path: apps/desktop/resources/ffmpeg
          key: lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.mjs', 'apps/desktop/scripts/fetch-ffmpeg.mjs') }}
          restore-keys: |
            lgpl-ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      - name: Locate zip and verify SHA-256
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          WANT=346fd19f3afe98a8606da4fc2984c8b411297734dba101cd91ec961fa8b2f875
          NAME=ffmpeg-n8.1.3-16-ge0a878dd70-win64-lgpl-8.1.zip
          ZIP=apps/desktop/resources/ffmpeg/.cache/btbn-win64-lgpl.zip
          if [ ! -f "$ZIP" ]; then
            echo "::error::Cache miss: $ZIP not found. Run a Windows pack once, or seed the cache."
            exit 1
          fi
          ACTUAL=$(sha256sum "$ZIP" | awk '{print $1}')
          if [ "$ACTUAL" != "$WANT" ]; then
            echo "::error::SHA mismatch: got $ACTUAL want $WANT"
            exit 1
          fi
          printf '%s  %s\n' "$WANT" "$NAME" > "${ZIP}.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$WANT" >> "$GITHUB_OUTPUT"

      - name: Upload to R2 deps/ffmpeg/
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '10'
          RELEASES_S3_BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
          RELEASES_S3_ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
          ZIP: ${{ steps.zip.outputs.zip }}
          NAME: ${{ steps.zip.outputs.name }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${RELEASES_S3_ENDPOINT:-}" ]; then
            extra+=(--endpoint-url "$RELEASES_S3_ENDPOINT")
          fi
          aws s3 cp "$ZIP" "s3://${RELEASES_S3_BUCKET}/deps/ffmpeg/${NAME}" "${extra[@]}"
          aws s3 cp "${ZIP}.sha256" "s3://${RELEASES_S3_BUCKET}/deps/ffmpeg/${NAME}.sha256" \
            --content-type text/plain "${extra[@]}"

      - name: Smoke public HTTPS
        shell: bash
        env:
          NAME: ${{ steps.zip.outputs.name }}
          WANT: ${{ steps.zip.outputs.sha }}
        run: |
          set -euo pipefail
          BASE=https://releases.okvevo.com/deps/ffmpeg
          code=$(curl -sI -o /dev/null -w '%{http_code}' "$BASE/$NAME")
          test "$code" = '200'
          got=$(curl -fsSL "$BASE/${NAME}.sha256" | awk '{print $1}')
          test "$got" = "$WANT"
          echo "mirror ok: $BASE/$NAME"
