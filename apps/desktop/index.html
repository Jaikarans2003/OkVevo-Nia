<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#2b2b2b" />
    <link rel="icon" type="image/png" sizes="180x180" href="/nia.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/nia.png" />
    <link rel="shortcut icon" href="/nia.png" />
    <title>Nia</title>
    <script>
      // Fixed Nia charcoal before the bundle loads — no OS-follow, no stored
      // light leftover from older builds.
      document.documentElement.style.backgroundColor = '#2b2b2b'
      document.documentElement.style.colorScheme = 'dark'
      document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
